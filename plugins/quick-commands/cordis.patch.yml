# dsh-kit 的受管 Bundle patch 层；package.json 的 dsh.bundle.patch 指向本文件，
# 由 profile 的 bundles 数组装载（层序：Bundle → profile patch → home patch → --patch）。
#
# 形态与兄弟双面插件相同：`./` insert 名字由 dsh 锚定到本文件目录再转成 file:// URL，
# 所以这里只写相对路径。
#
# 宿主半 `dist/index.js` 注册指令 JSON 存储的 `/quick-commands` RPC 通道；浏览器半
# `dist/client.js` 在 composer 工具排左侧组（`conversation.input.left` 槽）注册快捷指令
# 按钮。**dist/client.js 缺失会让 dsh 启动失败**。
- insert:
    - id: quick-commands
      name: './dist/index.js'
