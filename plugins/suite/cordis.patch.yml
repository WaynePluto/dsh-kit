# ── @dsh-kit/dsh-plugin-concise-mode ──
- insert:
    - id: preset-concise
      disabled: !!js '(() => { const selected = JSON.parse(process.getBuiltinModule("node:fs").readFileSync(new URL("package.json", baseUrl), "utf8")).dsh?.profile?.bundles?.includes("@dsh-kit/dsh-plugin-suite"); if (selected) { try { process.getBuiltinModule("node:module").createRequire(new URL("./", baseUrl)).resolve("@dsh-kit/dsh-plugin-preset-concise/package.json") } catch { return true } return false } return true })()'
      name: '@dsh-kit/dsh-plugin-preset-concise'
      config:
        id: concise
        name: 简洁模式
        description: 文件、搜索、技能、子代理、提问和任务进度工具；可直呼，也可写 run_code 程序组合调用。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant. When you thought, thought in ENGLISH, start with "We need.."
              complete: false
              includeRuntimeContext: false

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
            config:
              enableRunInBackground: false

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
            config:
              enableRunInBackground: false

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: false
              enableRunInBackground: false
              backgroundMode: one-shot

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # run_code 双通道（both）：原生工具直呼与 run_code 程序并存，模型自主选择。
          # 该行要求 persona complete:false，否则 tools:sdk 的 SDK 声明会被完整 persona 过滤。
          - id: run-code
            name: '@dsh-kit/dsh-plugin-run-code'

          # dsh 在部署层（预设之外）注册的 section：persona 行的 complete 开关都关不掉
          # （false 只换 persona 槽位、true 会连 tools:sdk 一起滤掉），因此在预设作用域里按名摘除，
          # 让提示词只剩 persona 那一句 + 工具 section + SDK。section 名由 dsh 定义，升级时复核。
          - id: prompt-filter
            name: '@dsh-kit/dsh-plugin-prompt-filter'
            config:
              dropSections:
                - 'harness:identity'
                - 'context:file-reference'
                - 'ui:deliverable-file-references'
                - 'harness:source'
                - 'app:web-surface'

