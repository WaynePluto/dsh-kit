# ── @dsh-kit/dsh-plugin-yolo-mode ──
- insert:
    - id: yolo-mode
      name: '@dsh-kit/dsh-plugin-yolo-mode'
      disabled: !!js '(() => { try { process.getBuiltinModule("node:module").createRequire(new URL("./", baseUrl)).resolve("@dsh-kit/dsh-plugin-yolo-mode/package.json") } catch { return true } return ((() => { const fs = process.getBuiltinModule("node:fs"); const read = (file) => { try { return fs.readFileSync(new URL(file, baseUrl), "utf8") } catch { return "" } }; let active = false; try { const bundles = JSON.parse(read("package.json") || "{}").dsh?.profile?.bundles ?? []; active = Array.isArray(bundles) && bundles.includes("@dsh-kit/dsh-plugin-suite") } catch { active = false } if (active) { const text = read("cordis.patch.yml").replace(/\r\n/g, "\n"); const names = ["@dsh-kit/dsh-plugin-yolo-mode", "./dist/index.js"]; const value = (m) => m?.[1]?.trim().replace(/^["\u0027]?|["\u0027]?$/g, ""); const nameOk = (span) => { const v = value(span.match(/\bname:[ \t]*([^,\n}]+)/)); return v === undefined || v === "" || names.includes(v) }; const disabledOf = (span) => { const m = span.match(/\bdisabled:[ \t]*(true|false)\b/); return m === null ? undefined : m[1] === "false" }; let enabled = false; const blocks = text.split(/^-/m); for (let i = 1; i < blocks.length; i += 1) { const block = "-" + blocks[i]; if (!/^-[ \t]*id:[ \t]*["\u0027]?yolo-mode["\u0027]?[ \t]*$/m.test(block)) continue; const rest = block.replace(/^-[^\n]*\n/, ""); if (!nameOk(rest)) continue; const d = disabledOf(rest); if (d !== undefined) enabled = d } for (const m of text.matchAll(/\{[^{}]*\bid:[ \t]*["\u0027]?yolo-mode["\u0027]?(?=[ \t]*[,}])[^{}]*\}/g)) { if (!nameOk(m[0])) continue; const d = disabledOf(m[0]); if (d !== undefined) enabled = d } active = enabled } return !active })()) })()'
