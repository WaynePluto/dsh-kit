# dsh-kit 全量套件 Bundle（本文件由 scripts/build-suite.mjs 生成，勿手改）。
# 单输入安装：官方 dsh 插件管理页「添加插件」输入本目录路径（或仓库地址），
# 即安装/升级全部组件。组件行沿用组合包的裸包名 + disabled 表达式约定：
# 套件被停用/卸载（离开 bundles 列表）时全部组件行一并禁用；insert 子行的表达式
# 另带可解析性守卫——运行中首次启用套件时（HMR 重组合的解析表仍是安装前的快照）
# 组件行整行禁用、延迟到重启装载，不产生 failed to import 报错弹窗。
#
# 固定契约：本层只有 insert 行，永不覆写官方行（D16）。任何对官方行（id 命中
# 官方 Bundle 行）的覆写都会让套件启停的重组合重启该行 fiber，级联重启注入其
# 服务的官方行——dsh 0.2.0 的 session-controller 在此级联中命中 file-upload
# Agent resolver 二次注册竞态，会话服务当场失败且重启前不恢复。

# ── @dsh-kit/dsh-plugin-proxy ──
- insert:
    - id: proxy
      disabled: !!js '(() => { const selected = JSON.parse(process.getBuiltinModule("node:fs").readFileSync(new URL("package.json", baseUrl), "utf8")).dsh?.profile?.bundles?.includes("@dsh-kit/dsh-plugin-suite"); if (selected) { try { process.getBuiltinModule("node:module").createRequire(new URL("./", baseUrl)).resolve("@dsh-kit/dsh-plugin-proxy/package.json") } catch { return true } return false } return true })()'
      name: '@dsh-kit/dsh-plugin-proxy'

