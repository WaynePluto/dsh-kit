# dsh-kit 的受管 Bundle patch 层；package.json 的 dsh.bundle.patch 指向本文件，
# 由 profile 的 bundles 数组装载（层序：Bundle → profile patch → home patch → --patch）。
#
# `./` insert 名字由 dsh 锚定到本文件目录再转成 file:// URL，故这里只写相对路径（D17）。
# 双面插件通过 package.json 的 `dsh.client` 与 `exports["./client"]` 下发 `dist/client.js`；
# 缺失客户端产物会让 dsh 启动失败。`id` 让后续 `--patch` 按 id 覆写，顺序为 bundle/profile/DSH_HOME/`--patch`。
# 宿主在 apply 时同步恢复持久化 runtime catalog（自包含 models 条目，llm-pi-ai 启动顺序无关，D16）。
# 机器相关代理地址通过 HTTPS_PROXY / HTTP_PROXY 配置。
- insert:
    - id: models-catalog
      name: './dist/index.js'
