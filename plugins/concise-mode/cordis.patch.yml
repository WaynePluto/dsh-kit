# dsh-kit 的 Agent preset Profile Bundle。它只作为第三方 Bundle 加入 profile 的 bundle 层，
# 不经 `--patch` 常驻挂载。
#
# dsh 0.1.7 起预设不再走文件系统 preset root，而是一行 `@deepseek-ai/dsh-agent-preset`
# 声明（config.plugins 即子插件行）；Web 编辑器保存的修改按行 id 覆盖 config.plugins。
- insert:
    - id: preset-concise
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: concise
        name: 简洁模式
        description: 文件、搜索、技能、子代理、提问和任务进度工具；可直呼，也可写 run_code 程序组合调用。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
              complete: false
              includeRuntimeContext: false

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
            config:
              enableRunInBackground: false

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
            config:
              enableRunInBackground: false

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: false
              enableRunInBackground: false
              backgroundMode: one-shot

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # run_code 双通道（both）：原生工具直呼与 run_code 程序并存，模型自主选择。
          # 该行要求 persona complete:false，否则 tools:sdk 的 SDK 声明会被完整 persona 过滤。
          - id: run-code
            name: '@dsh-kit/dsh-plugin-run-code'
