# 发布：推送 v* 标签 → 构建两半产物与套件 → 打自包含 tarball → 创建 GitHub Release。
# 单资产 dsh-kit.tar.gz（D21，2026-10-28 修订）：资产地址统一为带 tag 的固定名形式
#   https://github.com/WaynePluto/dsh-kit/releases/download/<tag>/dsh-kit.tar.gz
# 首次安装与升级同一形式（tag 变化即地址变化，官方管理器放行原地替换热升级；
# 同地址重复输入被拒为 already-installed）。README 的下载链接随每次发版更新 tag。
# 环境与 ci.yml 保持同版本（pnpm 10.17.0 + Node 22），产物可复现。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm plugins:build
      - run: pnpm suite:build
      - run: pnpm test
      # 标签与套件版本一致才产资产（pack-suite 校验 v<version>）。
      - run: node scripts/pack-suite.mjs "${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes "release/${GITHUB_REF_NAME}/dsh-kit.tar.gz"
