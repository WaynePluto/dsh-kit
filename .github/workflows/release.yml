# 发布：推送 v* 标签 → 构建两半产物与套件 → 打自包含 tarball → 创建 GitHub Release。
# 资产两名同内容（D21）：
# - 固定名 dsh-kit.tar.gz：「添加插件」首次安装永久使用
#   https://github.com/WaynePluto/dsh-kit/releases/latest/download/dsh-kit.tar.gz
#   （latest/download 恒指最新 Release；同地址重复输入会被官方管理器拒为
#   already-installed，不能用于升级）。
# - 版本名 dsh-kit-<version>.tar.gz：升级地址。「添加插件」输入新版本的资产 URL
#   即原地替换已装套件并在线热生效（无需先卸载；spec 与已存依赖值不同即放行）。
# 环境与 ci.yml 保持同版本（pnpm 10.17.0 + Node 22），产物可复现。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm plugins:build
      - run: pnpm suite:build
      - run: pnpm test
      # 标签与套件版本一致才产资产（pack-suite 校验 v<version>）。
      - run: node scripts/pack-suite.mjs "${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes release/dsh-kit.tar.gz "release/dsh-kit-*.tar.gz"
