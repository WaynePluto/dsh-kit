# ── @dsh-remote/dsh-plugin-yolo-mode ──
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# `never` 的含义是自动拒绝，不是自动允许；YOLO answerer 必须收到请求。

- id: approval
  config:
    policy: ask

# YOLO 接管权限策略，不再给用户展示实际无效的权限选择。

- id: permission
  disabled: true

- id: ui-permission
  disabled: true

- insert:
    - id: yolo-mode
      name: '@dsh-remote/dsh-plugin-yolo-mode'
      disabled: !!js '!JSON.parse(process.getBuiltinModule("node:fs").readFileSync(new URL("package.json", baseUrl), "utf8")).dsh?.profile?.bundles?.includes("@dsh-remote/dsh-plugin-suite")'
